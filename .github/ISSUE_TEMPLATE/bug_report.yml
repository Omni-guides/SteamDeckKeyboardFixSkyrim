name: Bug report
description: Report a crash, compatibility problem or unexpected behaviour
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test Steam Deck Keyboard Fix for Skyrim.
  - type: input
    id: skyrim-version
    attributes:
      label: Skyrim version
      placeholder: 1.6.1170
    validations:
      required: true
  - type: input
    id: skse-version
    attributes:
      label: SKSE version
      placeholder: 2.2.6
    validations:
      required: true
  - type: input
    id: proton-version
    attributes:
      label: Proton version
      placeholder: Proton 10, Proton Experimental, or GE-Proton version
    validations:
      required: true
  - type: input
    id: steam-deck
    attributes:
      label: Steam Deck and SteamOS details
      placeholder: LCD or OLED model, and Stable, Beta or Preview update channel
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include how the keyboard was opened and closed, and whether this occurred at the main menu or in-game.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Attach SteamDeckKeyboardFixSkyrim.log, skse64.log and any crash log.
        The SKSE logs are normally under
        `/home/deck/.local/share/Steam/steamapps/compatdata/<app-id>/pfx/drive_c/users/steamuser/Documents/My Games/Skyrim Special Edition/SKSE/`.
        Replace `<app-id>` with the Steam shortcut or mod-list application ID
        used by your installation. You can drag files into this box.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant mod-list changes or other details that may help reproduce the problem.
    validations:
      required: false
